sonar.organization=tcuong24
sonar.projectKey=cv-online-monorepo
sonar.projectName=CVision Online
sonar.host.url=https://sonarcloud.io
# Quét source code cả frontend & backend
sonar.sources=packages/cv-online-nestjs/src,packages/cv-online-nextjs/components,packages/cv-online-nextjs/lib,packages/cv-online-nextjs/app
sonar.tests=packages/cv-online-nestjs/src,packages/cv-online-nextjs/tests

# Báo cáo Coverage (Jest) và Test Execution (Playwright)
sonar.javascript.lcov.reportPaths=packages/cv-online-nestjs/coverage/lcov.info
sonar.testExecutionReportPaths=packages/cv-online-nextjs/playwright-results/junit.xml

# Loại trừ file test, build artifact, node_modules khỏi tính duplication/smells
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/coverage/**,**/playwright-report/**,**/playwright-results/**
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.sourceEncoding=UTF-8
