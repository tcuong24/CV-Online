name: cv-online

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvonline
      POSTGRES_USER: cvonline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvonline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvonline -d cvonline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: cv-online-backend:local
    environment:
      NODE_ENV: production
      PORT: 9999
      DATABASE_URL: postgresql://cvonline:${POSTGRES_PASSWORD:-cvonline}@postgres:5432/cvonline
      DIRECT_URL: postgresql://cvonline:${POSTGRES_PASSWORD:-cvonline}@postgres:5432/cvonline
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9999/api/templates?page=1&limit=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9999/api}
    image: cv-online-frontend:local
    environment:
      NODE_ENV: production
      PORT: 3000
      NEST_API_URL: http://backend:9999/api
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-nextauth-secret-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
